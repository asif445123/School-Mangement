<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#2563eb" />
<title>Offline — School Management System</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f8fafc;color:#1e293b;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 4px 24px rgba(15,23,42,.08);max-width:380px;width:100%;text-align:center;padding:32px 24px}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:19px;margin:16px 0 8px}
  p{font-size:14px;line-height:1.6;color:#64748b;margin:0 0 20px}
  button{background:#2563eb;color:#fff;border:0;border-radius:8px;font-size:14px;font-weight:600;padding:10px 22px;min-height:40px;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You are offline</h1>
    <p>The School Management app is installed, but this page needs an internet connection. Please check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
